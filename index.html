<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Bball12s"/>
<meta name="theme-color" content="#000000"/>
<link rel="manifest" href="manifest.json"/>
<title>🏀 1-on-1 Basketball 12s</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#070709;--card:#141418;--card2:#1b1b22;--card3:#262632;
  --text:#ffffff;--muted:#8e8e99;--subtle:#555562;
  --orange:#ff5e00;--orange-glow:rgba(255,94,0,0.35);
  --red:#ff453a;--blue:#0a84ff;--green:#30d158;--yellow:#ffd60a;
}

body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  min-height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  max-width:440px;margin:0 auto;user-select:none;
}

/* ── HEADER ── */
.top-bar{
  padding:calc(env(safe-area-inset-top,8px) + 8px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:#000;border-bottom:1px solid rgba(255,255,255,0.06);
}
.app-logo{font-size:1.15rem;font-weight:900;letter-spacing:-.5px;display:flex;align-items:center;gap:6px}
.app-logo span{color:var(--orange)}
.nav-pills{display:flex;background:var(--card2);padding:2px;border-radius:10px}
.nav-pill{
  padding:6px 14px;border:none;background:transparent;color:var(--muted);
  font-size:0.8rem;font-weight:700;border-radius:8px;cursor:pointer;transition:all .15s
}
.nav-pill.active{background:var(--card3);color:#fff}

/* ── PAGES ── */
.page{display:none;flex:1;flex-direction:column;overflow:hidden}
.page.active{display:flex}

/* ════════════════════════════════
   GAME PAGE (1-on-1 with 12s Shot Clock)
════════════════════════════════ */
.game-view{
  flex:1;display:flex;flex-direction:column;position:relative;background:linear-gradient(180deg,#100803 0%,#070709 50%);
}

/* Ambient glow */
.ambient-glow{
  position:absolute;top:-50px;left:50%;transform:translateX(-50%);
  width:260px;height:200px;border-radius:50%;
  background:radial-gradient(circle,var(--orange-glow) 0%,transparent 70%);
  pointer-events:none;z-index:0;
}

/* Header Game Status */
.court-status{
  padding:8px 16px;display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:1;font-size:0.75rem;font-weight:700;color:var(--muted);
}
.sound-toggle-btn{
  background:rgba(255,255,255,0.08);border:none;color:#fff;
  padding:4px 10px;border-radius:20px;font-size:0.75rem;cursor:pointer;
}

/* SHOT CLOCK (HERO) */
.shot-clock-section{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 16px;position:relative;z-index:1;
}
.shot-clock-title{
  font-size:0.7rem;font-weight:800;letter-spacing:2px;
  text-transform:uppercase;color:var(--orange);margin-bottom:2px;
}
.shot-clock-display{
  font-size:5.8rem;font-weight:900;line-height:1;letter-spacing:-2px;
  font-variant-numeric:tabular-nums;color:#fff;
  text-shadow:0 0 35px var(--orange-glow);cursor:pointer;
  transition:transform .08s,color .2s;
}
.shot-clock-display:active{transform:scale(0.95)}
.shot-clock-display.danger{
  color:var(--red);text-shadow:0 0 45px rgba(255,69,58,0.7);animation:shake .15s infinite alternate;
}
@keyframes shake{0%{transform:translateX(-2px)}100%{transform:translateX(2px)}}

.clock-quick-actions{
  display:flex;gap:8px;margin-top:6px;align-items:center;
}
.btn-clock{
  background:rgba(255,255,255,0.1);border:none;color:#fff;
  padding:7px 16px;border-radius:20px;font-size:0.8rem;font-weight:700;
  cursor:pointer;transition:background .15s;backdrop-filter:blur(8px);
}
.btn-clock:active{background:rgba(255,255,255,0.25)}
.btn-clock.reset-highlight{
  background:var(--orange);color:#fff;box-shadow:0 2px 14px var(--orange-glow);
}

/* PLAYERS MATCHUP */
.matchup-container{
  flex:1;display:flex;padding:6px 12px;gap:8px;position:relative;z-index:1;
}
.player-box{
  flex:1;background:var(--card);border-radius:18px;padding:12px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  border:1.5px solid transparent;position:relative;overflow:hidden;
}
.player-box.offense{
  border-color:var(--orange);background:linear-gradient(180deg,rgba(255,94,0,0.1) 0%,var(--card) 60%);
}
.player-box.defense{
  border-color:rgba(10,132,255,0.4);background:linear-gradient(180deg,rgba(10,132,255,0.06) 0%,var(--card) 60%);
}

.role-badge{
  font-size:0.62rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;margin-bottom:4px;
}
.offense .role-badge{background:var(--orange);color:#fff}
.defense .role-badge{background:var(--blue);color:#fff}

.p-name-txt{
  font-size:1.05rem;font-weight:800;color:#fff;text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.p-score-big{
  font-size:3.6rem;font-weight:900;line-height:1;margin:6px 0;
  font-variant-numeric:tabular-nums;
}
.offense .p-score-big{color:#fff;text-shadow:0 0 20px var(--orange-glow)}
.defense .p-score-big{color:var(--muted)}

.pt-btns{
  display:flex;gap:4px;width:100%;
}
.btn-pt{
  flex:1;padding:11px 0;border-radius:10px;border:none;
  background:var(--card2);color:#fff;font-size:0.88rem;font-weight:800;
  cursor:pointer;transition:transform .1s,background .15s;
}
.btn-pt:active{transform:scale(0.92);background:var(--orange)}

/* FAST COURT CONTROLS */
.court-controls{
  padding:10px 14px calc(env(safe-area-inset-bottom,8px) + 8px);
  background:#000;display:flex;flex-direction:column;gap:8px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.court-action-row{display:flex;gap:8px}
.btn-big-action{
  flex:1;padding:15px 10px;border-radius:14px;border:none;
  font-size:0.95rem;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .1s,opacity .15s;
}
.btn-big-action:active{transform:scale(0.96)}
.btn-scored{
  background:var(--green);color:#000;box-shadow:0 4px 18px rgba(48,209,88,0.3);
}
.btn-missed{
  background:rgba(255,255,255,0.12);color:#fff;
}
.btn-rotate{
  background:var(--blue);color:#fff;box-shadow:0 4px 18px rgba(10,132,255,0.3);
}

/* BENCH / QUEUE STRIP */
.queue-strip{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:var(--card2);border-radius:12px;font-size:0.75rem;
}
.queue-label{color:var(--muted);font-weight:700}
.queue-list{display:flex;gap:6px;align-items:center}
.queue-chip{
  background:var(--card3);padding:3px 8px;border-radius:6px;font-weight:700;color:#ddd;
}
.queue-chip.next{background:rgba(255,94,0,0.25);color:var(--orange);border:1px solid var(--orange)}

/* ════════════════════════════════
   SETTINGS & PLAYERS
════════════════════════════════ */
.settings-wrap{flex:1;overflow-y:auto;padding:16px 14px 40px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border-radius:16px;overflow:hidden}
.panel-head{padding:12px 14px 6px;font-size:0.68rem;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.input-group{padding:6px 12px 14px;display:flex;flex-direction:column;gap:8px}
.p-input-line{
  display:flex;align-items:center;gap:10px;background:var(--card2);padding:10px 14px;border-radius:12px;
}
.p-input-line span{font-size:1.1rem}
.p-input-line input{
  flex:1;background:transparent;border:none;color:#fff;font-size:0.95rem;outline:none;
}
.sec-selector{
  display:flex;gap:6px;padding:6px 12px 14px;
}
.btn-sec-sel{
  flex:1;padding:10px 4px;border-radius:10px;border:1.5px solid var(--subtle);
  background:transparent;color:var(--muted);font-weight:800;font-size:0.85rem;cursor:pointer;
}
.btn-sec-sel.active{border-color:var(--orange);color:#fff;background:rgba(255,94,0,0.15)}

.btn-start-game{
  padding:16px;border-radius:14px;border:none;background:var(--orange);
  color:#fff;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 4px 20px var(--orange-glow);
}
.btn-start-game:active{transform:scale(0.97)}

/* ════════════════════════════════
   HISTORY & LEADERBOARD
════════════════════════════════ */
.hist-wrap{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.leader-card{background:var(--card);border-radius:16px;padding:14px}
.leader-title{font-size:0.7rem;font-weight:800;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.l-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.l-row:last-child{border-bottom:none}
.l-name{font-weight:700;font-size:0.95rem}
.l-pts{font-weight:900;color:var(--orange)}

/* TOAST */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:rgba(25,25,30,0.95);color:#fff;padding:8px 18px;border-radius:20px;
  font-size:0.82rem;font-weight:700;border:1px solid rgba(255,255,255,0.12);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:999;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="top-bar">
  <div class="app-logo">🏀 1-on-1 <span>12s</span></div>
  <div class="nav-pills">
    <button class="nav-pill active" onclick="switchTab('game')">สนาม</button>
    <button class="nav-pill" onclick="switchTab('settings')">ผู้เล่น</button>
    <button class="nav-pill" onclick="switchTab('history')">สถิติ</button>
  </div>
</div>

<!-- ═══ GAME SCREEN (KING OF COURT) ═══ -->
<div class="page active" id="tab-game">
  <div class="game-view">
    <div class="ambient-glow"></div>

    <div class="court-status">
      <span id="matchInfo">👑 ครองแป้น: ยิงลงอยู่ต่อ</span>
      <button class="sound-toggle-btn" id="soundBtn" onclick="toggleSound()">🔊 เสียง: เปิด</button>
    </div>

    <!-- SHOT CLOCK -->
    <div class="shot-clock-section">
      <div class="shot-clock-title">SHOT CLOCK</div>
      <div class="shot-clock-display" id="clockNum" onclick="toggleClock()">12</div>
      <div class="clock-quick-actions">
        <button class="btn-clock" id="clockPlayBtn" onclick="toggleClock()">▶ เริ่ม</button>
        <button class="btn-clock reset-highlight" onclick="resetClock(true)">↺ รีเซ็ต 12s</button>
        <button class="btn-clock" onclick="resetClockTo(14)">14s</button>
      </div>
    </div>

    <!-- PLAYERS ON COURT -->
    <div class="matchup-container">
      <!-- Offense / King -->
      <div class="player-box offense" id="p1Box">
        <div class="role-badge">👑 คนบุก (ครองแป้น)</div>
        <div class="p-name-txt" id="p1Name">ผู้เล่น 1</div>
        <div class="p-score-big" id="p1Score">0</div>
        <div class="pt-btns">
          <button class="btn-pt" onclick="addPoint(0,1)">+1</button>
          <button class="btn-pt" onclick="addPoint(0,2)">+2</button>
          <button class="btn-pt" onclick="addPoint(0,3)">+3</button>
        </div>
      </div>

      <!-- Defense / Challenger -->
      <div class="player-box defense" id="p2Box">
        <div class="role-badge">🛡️ คนรับ (ผู้ท้าชิง)</div>
        <div class="p-name-txt" id="p2Name">ผู้เล่น 2</div>
        <div class="p-score-big" id="p2Score">0</div>
        <div class="pt-btns">
          <button class="btn-pt" onclick="addPoint(1,1)">+1</button>
          <button class="btn-pt" onclick="addPoint(1,2)">+2</button>
          <button class="btn-pt" onclick="addPoint(1,3)">+3</button>
        </div>
      </div>
    </div>
  </div>

  <!-- COURT CONTROLS -->
  <div class="court-controls">
    <!-- Queue Bar -->
    <div class="queue-strip">
      <span class="queue-label">คิวรอถัดไป:</span>
      <div class="queue-list" id="benchQueue">
        <span class="queue-chip next" id="benchNext">ผู้เล่น 3</span>
        <span class="queue-chip" id="benchAfter">ผู้เล่น 4</span>
      </div>
    </div>

    <!-- Actions for 12s 1-on-1 -->
    <div class="court-action-row">
      <button class="btn-big-action btn-scored" onclick="onShotScored()">
        🏀 ยิงลง (+1 & ↺ 12s)
      </button>
      <button class="btn-big-action btn-missed" onclick="onShotMissed()">
        ❌ ยิงไม่ลง (สลับคน)
      </button>
    </div>
    
    <div class="court-action-row">
      <button class="btn-big-action btn-rotate" onclick="rotateDefender()">
        🔄 หมุนคนถัดไปขึ้นมา
      </button>
      <button class="btn-big-action" style="background:var(--card2);color:#aaa;flex:0.6" onclick="undoLast()">
        ↩ ย้อนกลับ
      </button>
    </div>
  </div>
</div>

<!-- ═══ SETTINGS / PLAYERS ═══ -->
<div class="page" id="tab-settings">
  <div class="settings-wrap">
    <div class="panel">
      <div class="panel-head">รายชื่อผู้เล่น 4 คน (เรียงตามลำดับคิว)</div>
      <div class="input-group">
        <div class="p-input-line">
          <span>👑</span>
          <input type="text" id="nameIn0" value="ผู้เล่น 1" placeholder="คนครองแป้นแรก"/>
        </div>
        <div class="p-input-line">
          <span>🛡️</span>
          <input type="text" id="nameIn1" value="ผู้เล่น 2" placeholder="ผู้ท้าชิงแรก"/>
        </div>
        <div class="p-input-line">
          <span>⏳</span>
          <input type="text" id="nameIn2" value="ผู้เล่น 3" placeholder="คิวรอคนที่ 1"/>
        </div>
        <div class="p-input-line">
          <span>⏳</span>
          <input type="text" id="nameIn3" value="ผู้เล่น 4" placeholder="คิวรอคนที่ 2"/>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">เวลา Shot Clock เริ่มต้น</div>
      <div class="sec-selector">
        <button class="btn-sec-sel active" onclick="setDefaultSeconds(12,this)">12 วินาที</button>
        <button class="btn-sec-sel" onclick="setDefaultSeconds(14,this)">14 วินาที</button>
        <button class="btn-sec-sel" onclick="setDefaultSeconds(24,this)">24 วินาที</button>
      </div>
    </div>

    <button class="btn-start-game" onclick="applySettingsAndStart()">
      ✓ บันทึก & เริ่มเกม
    </button>
  </div>
</div>

<!-- ═══ HISTORY & STATS ═══ -->
<div class="page" id="tab-history">
  <div class="hist-wrap">
    <div class="leader-card">
      <div class="leader-title">🏆 ลีดเดอร์บอร์ด (คะแนนรวมวันนี้)</div>
      <div id="leaderboardList"></div>
    </div>
    <button class="btn-clock" style="background:rgba(255,69,58,0.15);color:var(--red);padding:12px;border-radius:12px" onclick="clearStats()">
      🗑️ ล้างคะแนนทั้งหมด
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// AUDIO (WEB AUDIO API - ZERO ASSETS NEEDED)
// ══════════════════════════════════════════
let audioCtx = null;
let soundEnabled = true;

function initAudio(){
  if(!audioCtx){
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if(AudioContext) audioCtx = new AudioContext();
  }
  if(audioCtx && audioCtx.state === 'suspended'){
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, count=1, interval=0.1){
  if(!soundEnabled) return;
  initAudio();
  if(!audioCtx) return;

  for(let i=0; i<count; i++){
    setTimeout(()=>{
      try{
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      }catch(e){}
    }, i * (duration + interval) * 1000);
  }
}

function soundScore(){ playTone(600, 'sine', 0.15); }
function soundTick(){ playTone(800, 'triangle', 0.04); }
function soundBuzzer(){ playTone(220, 'sawtooth', 0.8, 2, 0.08); } // Buzzer หมดเวลา 12 วิ

function toggleSound(){
  soundEnabled = !soundEnabled;
  document.getElementById('soundBtn').textContent = soundEnabled ? '🔊 เสียง: เปิด' : '🔇 เสียง: ปิด';
  showToast(soundEnabled ? 'เปิดเสียงแล้ว' : 'ปิดเสียงแล้ว');
}

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let defaultSec = 12;
let clockSec = 12;
let clockRunning = false;
let clockTimer = null;

// Roster order: [0] = King/Offense, [1] = Defender, [2] = Next, [3] = After
let roster = ['ผู้เล่น 1', 'ผู้เล่น 2', 'ผู้เล่น 3', 'ผู้เล่น 4'];
let playerScores = {
  'ผู้เล่น 1': 0,
  'ผู้เล่น 2': 0,
  'ผู้เล่น 3': 0,
  'ผู้เล่น 4': 0
};
let historyLog = [];

// ══════════════════════════════════════════
// SHOT CLOCK LOGIC
// ══════════════════════════════════════════
function updateClockDisplay(){
  const el = document.getElementById('clockNum');
  el.textContent = clockSec;
  el.classList.toggle('danger', clockSec <= 3 && clockSec > 0);
}

function startClock(){
  initAudio();
  if(clockRunning) return;
  if(clockSec <= 0) clockSec = defaultSec;
  clockRunning = true;
  document.getElementById('clockPlayBtn').textContent = '⏸ หยุด';
  
  clockTimer = setInterval(()=>{
    clockSec--;
    updateClockDisplay();
    if(clockSec <= 3 && clockSec > 0) soundTick();
    if(clockSec <= 0){
      stopClock();
      soundBuzzer();
      if(navigator.vibrate) navigator.vibrate([200, 100, 300]);
      showToast('🚨 หมดเวลา 12 วินาที!');
    }
  }, 1000);
}

function stopClock(){
  clearInterval(clockTimer);
  clockTimer = null;
  clockRunning = false;
  document.getElementById('clockPlayBtn').textContent = '▶ เริ่ม';
}

function toggleClock(){
  if(clockRunning) stopClock(); else startClock();
}

function resetClock(autoStart=true){
  stopClock();
  clockSec = defaultSec;
  updateClockDisplay();
  if(autoStart) startClock();
}

function resetClockTo(sec){
  stopClock();
  clockSec = sec;
  updateClockDisplay();
  startClock();
}

// ══════════════════════════════════════════
// 1-ON-1 KING OF COURT RULES
// ══════════════════════════════════════════

// บันทึก Log สำหรับ Undo
function saveStateForUndo(){
  historyLog.push({
    roster: [...roster],
    scores: {...playerScores},
    clockSec: clockSec
  });
  if(historyLog.length > 20) historyLog.shift();
}

function undoLast(){
  if(!historyLog.length){ showToast('ไม่มีรายการย้อนกลับ'); return; }
  const last = historyLog.pop();
  roster = last.roster;
  playerScores = last.scores;
  clockSec = last.clockSec;
  updateUI();
  updateClockDisplay();
  showToast('↩ ย้อนกลับสำเร็จ');
}

// ยิงลง: ผู้บุกได้แต้ม + ครองแป้นต่อ + รีเซ็ต 12 วิ
function onShotScored(){
  saveStateForUndo();
  const king = roster[0];
  playerScores[king] = (playerScores[king] || 0) + 1;
  soundScore();
  if(navigator.vibrate) navigator.vibrate(50);
  resetClock(true);
  updateUI();
  showToast(`🏀 ${king} ยิงลง! (+1) ครองแป้นต่อ`);
}

// ยิงไม่ลง: ผู้บุกไปต่อท้ายคิว คนรับขึ้นมาเป็นคนบุก คนคิวถัดไปเข้ามาเป็นคนรับ
function onShotMissed(){
  saveStateForUndo();
  const oldKing = roster.shift(); // คนบุกหลุดไปท้ายคิว
  roster.push(oldKing);
  resetClock(true);
  updateUI();
  showToast(`❌ ยิงไม่ลง! ${roster[0]} ครองแป้นแทน`);
}

// สลับคนป้องกัน (เช่น คนบุกยิงลง แต่อยากเปลี่ยนคนรับใหม่เข้ามาท้าชิง)
function rotateDefender(){
  saveStateForUndo();
  // roster[1] (คนรับเก่า) หลุดไปท้ายคิว, roster[2] เข้ามาแทน
  const oldDefender = roster.splice(1, 1)[0];
  roster.push(oldDefender);
  resetClock(true);
  updateUI();
  showToast(`🔄 ${roster[1]} เข้ามาท้าชิง`);
}

// เพิ่มแต้มแบบกำหนดเอง (+1, +2, +3)
function addPoint(playerSlot, pts){
  saveStateForUndo();
  const pName = roster[playerSlot];
  playerScores[pName] = (playerScores[pName] || 0) + pts;
  soundScore();
  resetClock(true);
  updateUI();
}

// ══════════════════════════════════════════
// UI UPDATES
// ══════════════════════════════════════════
function updateUI(){
  document.getElementById('p1Name').textContent = roster[0];
  document.getElementById('p1Score').textContent = playerScores[roster[0]] || 0;

  document.getElementById('p2Name').textContent = roster[1];
  document.getElementById('p2Score').textContent = playerScores[roster[1]] || 0;

  document.getElementById('benchNext').textContent = roster[2];
  document.getElementById('benchAfter').textContent = roster[3];

  renderLeaderboard();
}

function renderLeaderboard(){
  const container = document.getElementById('leaderboardList');
  if(!container) return;
  const sorted = Object.entries(playerScores).sort((a,b)=>b[1]-a[1]);
  const medals = ['🥇','🥈','🥉','4️⃣'];
  container.innerHTML = sorted.map(([name, pts], i)=>`
    <div class="l-row">
      <div class="l-name">${medals[i]} ${name}</div>
      <div class="l-pts">${pts} แต้ม</div>
    </div>
  `).join('');
}

function clearStats(){
  if(confirm('รีเซ็ตแต้มผู้เล่นทุกคนเป็น 0?')){
    Object.keys(playerScores).forEach(k => playerScores[k] = 0);
    historyLog = [];
    updateUI();
    showToast('ล้างแต้มเรียบร้อย');
  }
}

// ══════════════════════════════════════════
// SETTINGS
// ══════════════════════════════════════════
function setDefaultSeconds(sec, btn){
  document.querySelectorAll('.btn-sec-sel').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  defaultSec = sec;
  clockSec = sec;
  updateClockDisplay();
}

function applySettingsAndStart(){
  for(let i=0; i<4; i++){
    const val = document.getElementById(`nameIn${i}`).value.trim();
    if(val) roster[i] = val;
    if(playerScores[roster[i]] === undefined) playerScores[roster[i]] = 0;
  }
  updateUI();
  resetClock(false);
  switchTab('game');
  showToast('บันทึกและเริ่มเล่น!');
}

// ══════════════════════════════════════════
// NAVIGATION & HELPERS
// ══════════════════════════════════════════
function switchTab(tabId){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-pill').forEach(b=>b.classList.remove('active'));
  document.getElementById(`tab-${tabId}`).classList.add('active');

  const tabIndex = {game:0, settings:1, history:2}[tabId];
  document.querySelectorAll('.nav-pill')[tabIndex].classList.add('active');

  if(tabId === 'history') renderLeaderboard();
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

// Initialize
updateUI();
updateClockDisplay();
</script>
</body>
</html>
