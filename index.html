<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="BballScore"/>
  <meta name="theme-color" content="#f4772e"/>
  <link rel="manifest" href="manifest.json"/>
  <title>🏀 Basketball Score</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --orange:#f4772e;--orange2:#e05a10;--orange3:#ff9a5c;
      --bg:#0d0d14;--card:#151522;--card2:#1e1e30;--card3:#252540;
      --text:#f0f0f8;--muted:#6b7190;
      --red:#ff5c5c;--blue:#4c9fe0;--green:#3ecf7e;--purple:#a78bfa;
    }
    body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
      min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}

    /* ── HEADER ── */
    .app-header{
      background:linear-gradient(135deg,var(--orange2),var(--orange),var(--orange3));
      padding:env(safe-area-inset-top,12px) 16px 14px;
      text-align:center;position:relative;
      box-shadow:0 6px 30px rgba(244,119,46,0.35);
    }
    .app-header h1{font-size:1.25rem;font-weight:800;letter-spacing:1.5px}
    .app-header p{font-size:0.7rem;opacity:.8;margin-top:2px;letter-spacing:.5px}

    /* ── TABS ── */
    .tab-bar{display:flex;background:var(--card);border-bottom:1px solid rgba(255,255,255,0.05)}
    .tab-bar button{
      flex:1;padding:11px 0;font-size:0.78rem;font-weight:700;
      background:none;border:none;color:var(--muted);cursor:pointer;
      border-bottom:3px solid transparent;transition:all .2s;letter-spacing:.3px
    }
    .tab-bar button.active{color:var(--orange);border-bottom-color:var(--orange)}

    /* ── PAGES ── */
    .page{display:none;flex:1;flex-direction:column}
    .page.active{display:flex}

    /* ════════════════════════════════
       SETUP PAGE
    ════════════════════════════════ */
    .setup-page{padding:16px;gap:14px;overflow-y:auto}
    .section-label{font-size:0.7rem;font-weight:800;letter-spacing:1.5px;
      text-transform:uppercase;color:var(--muted);margin-bottom:-4px}

    .mode-row{display:flex;gap:8px}
    .mode-btn{
      flex:1;padding:14px 8px;border-radius:14px;border:2px solid var(--card3);
      background:var(--card);color:var(--muted);font-size:0.85rem;font-weight:700;
      cursor:pointer;text-align:center;transition:all .2s;line-height:1.4
    }
    .mode-btn.active{background:linear-gradient(135deg,var(--orange2),var(--orange));
      border-color:var(--orange);color:#fff;box-shadow:0 4px 16px rgba(244,119,46,0.4)}
    .mode-btn .mode-icon{font-size:1.5rem;display:block;margin-bottom:4px}

    .players-grid{display:flex;flex-direction:column;gap:10px}
    .player-input-row{
      display:flex;align-items:center;gap:10px;
      background:var(--card);border-radius:14px;padding:12px 14px;
    }
    .player-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0}
    .player-input-row input{
      flex:1;background:transparent;border:none;
      font-size:1rem;color:var(--text);outline:none
    }
    .player-input-row input::placeholder{color:var(--muted)}

    .target-card{background:var(--card);border-radius:14px;padding:14px}
    .target-card label{font-size:0.8rem;color:var(--muted);display:block;margin-bottom:10px}
    .target-btns{display:flex;gap:6px;flex-wrap:wrap}
    .target-btns button{
      flex:1;min-width:48px;padding:9px 4px;border-radius:10px;
      border:2px solid var(--card3);background:var(--card3);
      color:var(--muted);font-size:0.85rem;font-weight:700;cursor:pointer;transition:all .15s
    }
    .target-btns button.sel{background:var(--orange);border-color:var(--orange);color:#fff}

    .timer-card{background:var(--card);border-radius:14px;padding:14px}
    .timer-card label{font-size:0.8rem;color:var(--muted);display:block;margin-bottom:10px}
    .timer-row{display:flex;gap:6px;align-items:center}
    .timer-toggle{
      display:flex;align-items:center;gap:8px;cursor:pointer;
      font-size:0.85rem;font-weight:600
    }
    .toggle-switch{
      width:44px;height:24px;background:var(--card3);border-radius:12px;
      position:relative;transition:background .2s;flex-shrink:0
    }
    .toggle-switch::after{
      content:'';width:18px;height:18px;background:#fff;border-radius:50%;
      position:absolute;top:3px;left:3px;transition:left .2s
    }
    .toggle-switch.on{background:var(--orange)}
    .toggle-switch.on::after{left:23px}
    .quarter-btns{display:flex;gap:6px;margin-top:10px}
    .quarter-btns button{
      flex:1;padding:9px 4px;border-radius:10px;border:2px solid var(--card3);
      background:var(--card3);color:var(--muted);font-size:0.78rem;font-weight:700;
      cursor:pointer;transition:all .15s
    }
    .quarter-btns button.sel{background:var(--orange);border-color:var(--orange);color:#fff}

    .start-btn{
      background:linear-gradient(135deg,var(--orange2),var(--orange));
      color:#fff;border:none;border-radius:16px;padding:17px;
      font-size:1.1rem;font-weight:800;cursor:pointer;letter-spacing:.5px;
      box-shadow:0 6px 24px rgba(244,119,46,0.45);transition:transform .1s,box-shadow .1s
    }
    .start-btn:active{transform:scale(.97)}

    /* ════════════════════════════════
       GAME PAGE - 1v1
    ════════════════════════════════ */
    .game-page{overflow:hidden}
    .game-top{
      display:flex;justify-content:space-between;align-items:center;
      padding:9px 14px;background:var(--card);
    }
    .game-info{font-size:0.75rem;color:var(--muted)}
    .game-info b{color:var(--orange)}
    .top-actions{display:flex;gap:6px}
    .icon-btn{
      background:rgba(255,255,255,0.07);border:none;border-radius:10px;
      width:36px;height:36px;font-size:1rem;cursor:pointer;color:var(--text);
      display:flex;align-items:center;justify-content:center;transition:background .15s
    }
    .icon-btn:active{background:rgba(255,255,255,0.15)}

    /* Timer bar */
    .timer-bar{
      background:var(--card2);padding:10px 16px;
      display:flex;align-items:center;gap:12px;
      border-bottom:1px solid rgba(255,255,255,0.05)
    }
    .timer-bar.hidden{display:none}
    .quarter-badge{
      background:var(--orange);color:#fff;font-size:0.7rem;font-weight:800;
      padding:3px 9px;border-radius:8px;letter-spacing:.5px
    }
    .timer-display{
      font-size:1.6rem;font-weight:900;letter-spacing:2px;
      font-variant-numeric:tabular-nums;color:var(--text);flex:1
    }
    .timer-display.warning{color:#ff5c5c;animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .timer-ctrl{display:flex;gap:6px}
    .timer-ctrl button{
      padding:7px 14px;border-radius:10px;border:none;
      font-size:0.8rem;font-weight:700;cursor:pointer;transition:all .15s
    }
    .btn-timer-play{background:var(--green);color:#000}
    .btn-timer-next{background:var(--card3);color:var(--text)}

    /* Scoreboard */
    .scoreboard{display:flex;flex:1}
    .player-side{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:16px 10px;gap:14px;position:relative
    }
    .player-side.p1{background:radial-gradient(ellipse at top,#2a1020 0%,var(--bg) 70%)}
    .player-side.p2{background:radial-gradient(ellipse at top,#101e2e 0%,var(--bg) 70%)}
    .v-divider{width:1px;background:linear-gradient(180deg,transparent,rgba(255,255,255,0.12),transparent);align-self:stretch}

    .p-name{
      font-size:0.9rem;font-weight:800;letter-spacing:.5px;
      text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap
    }
    .p1 .p-name{color:var(--red)}
    .p2 .p-name{color:var(--blue)}

    .score-num{
      font-size:5.5rem;font-weight:900;line-height:1;text-align:center;
      text-shadow:0 6px 30px rgba(0,0,0,0.6);transition:transform .1s
    }
    .score-num.bump{animation:bump .15s ease-out}
    @keyframes bump{0%{transform:scale(1.35)}100%{transform:scale(1)}}

    .add-btns{display:flex;gap:6px}
    .add-btn{
      min-width:52px;padding:12px 10px;border-radius:13px;border:none;
      font-size:1.05rem;font-weight:800;cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,0.35);transition:transform .1s,box-shadow .1s
    }
    .add-btn:active{transform:scale(.9);box-shadow:0 2px 6px rgba(0,0,0,0.3)}
    .p1 .add-btn{background:linear-gradient(135deg,#c93030,var(--red));color:#fff}
    .p2 .add-btn{background:linear-gradient(135deg,#2a6ea8,var(--blue));color:#fff}

    .game-footer{
      display:flex;gap:8px;padding:12px 14px;
      background:var(--card);border-top:1px solid rgba(255,255,255,0.05)
    }
    .game-footer button{
      flex:1;padding:11px 6px;border-radius:12px;border:none;
      font-size:0.82rem;font-weight:700;cursor:pointer;transition:transform .1s
    }
    .game-footer button:active{transform:scale(.95)}
    .btn-undo{background:rgba(255,255,255,0.09);color:var(--text)}
    .btn-reset{background:rgba(255,92,92,0.18);color:var(--red)}
    .btn-end{background:linear-gradient(135deg,var(--orange2),var(--orange));color:#fff}

    /* ════════════════════════════════
       ROUND ROBIN PAGE
    ════════════════════════════════ */
    .rr-page{overflow-y:auto;padding:0}

    .rr-header{
      padding:12px 16px;background:var(--card);
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid rgba(255,255,255,0.05)
    }
    .rr-header h2{font-size:0.95rem;font-weight:800}

    /* Standings */
    .standings-card{background:var(--card);margin:12px;border-radius:16px;overflow:hidden}
    .standings-title{
      padding:10px 14px;font-size:0.7rem;font-weight:800;
      letter-spacing:1px;color:var(--muted);text-transform:uppercase;
      background:var(--card2);border-bottom:1px solid rgba(255,255,255,0.05)
    }
    .standings-row{
      display:flex;align-items:center;gap:10px;
      padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04)
    }
    .standings-row:last-child{border-bottom:none}
    .rank-badge{
      width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:0.8rem;font-weight:800;flex-shrink:0
    }
    .rank-1{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#000}
    .rank-2{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#000}
    .rank-3{background:linear-gradient(135deg,#b45309,#d97706);color:#fff}
    .rank-4{background:var(--card3);color:var(--muted)}
    .s-name{flex:1;font-weight:700;font-size:0.9rem}
    .s-stats{display:flex;gap:12px;font-size:0.78rem;color:var(--muted)}
    .s-stats span b{color:var(--text)}

    /* Matches */
    .matches-section{margin:0 12px 12px;display:flex;flex-direction:column;gap:8px}
    .matches-title{
      font-size:0.7rem;font-weight:800;letter-spacing:1px;
      color:var(--muted);text-transform:uppercase;margin-bottom:2px
    }
    .match-card{
      background:var(--card);border-radius:14px;padding:14px;
      display:flex;align-items:center;gap:10px;
      border:1px solid rgba(255,255,255,0.05);cursor:pointer;
      transition:border-color .2s,background .2s
    }
    .match-card.current{border-color:var(--orange);background:rgba(244,119,46,0.08)}
    .match-card.done{border-color:rgba(62,207,126,0.3);opacity:.75}
    .match-card.pending{opacity:.5;cursor:default}

    .m-vs{text-align:center;min-width:28px}
    .m-vs span{font-size:0.65rem;font-weight:800;color:var(--muted);letter-spacing:1px}
    .m-player{flex:1;text-align:center;font-weight:700;font-size:0.85rem}
    .m-player.left{text-align:right}
    .m-player.right{text-align:left}
    .m-score-box{
      min-width:70px;text-align:center;font-size:1rem;font-weight:900;
      color:var(--orange);letter-spacing:2px
    }
    .m-status{font-size:0.7rem;text-align:center;color:var(--muted);margin-top:3px}

    .rr-footer{padding:12px 16px}
    .rr-next-btn{
      width:100%;padding:14px;border-radius:14px;border:none;
      background:linear-gradient(135deg,var(--orange2),var(--orange));
      color:#fff;font-size:1rem;font-weight:800;cursor:pointer;
      box-shadow:0 4px 20px rgba(244,119,46,0.4)
    }
    .rr-next-btn:disabled{background:var(--card3);color:var(--muted);box-shadow:none;cursor:default}

    /* ════════════════════════════════
       HISTORY PAGE
    ════════════════════════════════ */
    .history-page{padding:12px;gap:10px;overflow-y:auto}
    .history-empty{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:12px;
      color:var(--muted);text-align:center
    }
    .history-empty .big{font-size:3rem}

    .leader-card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:4px}
    .leader-card .label{font-size:0.7rem;font-weight:800;letter-spacing:1px;
      color:var(--muted);text-transform:uppercase;margin-bottom:10px}
    .leader-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
    .leader-row span:last-child{color:var(--orange);font-weight:800}

    .h-card{
      background:var(--card);border-radius:12px;padding:12px 14px;
      display:flex;align-items:center;gap:10px;border-left:3px solid var(--orange)
    }
    .h-icon{font-size:1.6rem}
    .h-info{flex:1}
    .h-players{font-size:0.85rem;font-weight:700}
    .h-result{font-size:0.78rem;color:var(--muted);margin-top:2px}
    .h-date{font-size:0.68rem;color:var(--muted);margin-top:2px}

    .clear-btn{
      background:rgba(255,92,92,0.12);color:var(--red);
      border:1px solid rgba(255,92,92,0.25);border-radius:12px;
      padding:11px;font-size:0.82rem;font-weight:700;cursor:pointer;
      width:100%;margin-top:4px
    }

    /* ════════════════════════════════
       WIN OVERLAY
    ════════════════════════════════ */
    .win-overlay{
      display:none;position:fixed;inset:0;
      background:rgba(0,0,0,0.88);z-index:100;
      flex-direction:column;align-items:center;justify-content:center;
      gap:16px;padding:32px
    }
    .win-overlay.show{display:flex;animation:fadeUp .3s}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    .confetti-row{font-size:2rem;letter-spacing:4px}
    .win-label{font-size:0.85rem;color:var(--muted);font-weight:700;letter-spacing:1px}
    .win-name{font-size:2.4rem;font-weight:900;color:var(--orange);text-align:center;line-height:1.1}
    .win-score{font-size:1rem;color:var(--muted);margin-top:4px}
    .win-actions{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:12px}
    .win-actions button{
      padding:14px;border-radius:14px;border:none;
      font-size:0.95rem;font-weight:800;cursor:pointer
    }
    .btn-new{background:linear-gradient(135deg,var(--orange2),var(--orange));color:#fff}
    .btn-back{background:rgba(255,255,255,0.09);color:var(--text)}

    /* ── TOAST ── */
    .toast{
      position:fixed;bottom:85px;left:50%;transform:translateX(-50%);
      background:rgba(20,20,35,0.96);color:var(--text);
      padding:9px 20px;border-radius:20px;font-size:0.82rem;
      opacity:0;pointer-events:none;transition:opacity .2s;
      z-index:200;white-space:nowrap;border:1px solid rgba(255,255,255,0.1)
    }
    .toast.show{opacity:1}

    /* ── COLORS ── */
    .c0{background:#ff5c5c} .c1{background:#4c9fe0}
    .c2{background:#3ecf7e} .c3{background:#a78bfa}
  </style>
</head>
<body>

<div class="app-header">
  <h1>🏀 Basketball Score</h1>
  <p>1-ON-1 SCORE TRACKER</p>
</div>

<div class="tab-bar" id="tabBar">
  <button class="active" onclick="showTab('setup')">⚙️ ตั้งค่า</button>
  <button onclick="showTab('game')"  id="tabGameBtn">🏀 เกม</button>
  <button onclick="showTab('history')">📊 ประวัติ</button>
</div>

<!-- ══ SETUP ══ -->
<div class="page setup-page active" id="tab-setup">

  <p class="section-label">โหมด</p>
  <div class="mode-row">
    <button class="mode-btn active" id="mode1v1" onclick="setMode('1v1')">
      <span class="mode-icon">👤</span>1 vs 1
    </button>
    <button class="mode-btn" id="modeRR" onclick="setMode('rr')">
      <span class="mode-icon">👥</span>Round Robin<br><small style="font-weight:500;font-size:0.7rem">4 คน</small>
    </button>
  </div>

  <p class="section-label">ผู้เล่น</p>
  <div class="players-grid" id="playersGrid">
    <!-- rendered by JS -->
  </div>

  <div class="target-card">
    <label>🎯 เล่นถึงกี่แต้ม (First to win)</label>
    <div class="target-btns" id="targetBtns">
      <button onclick="selTarget(this,11)">11</button>
      <button onclick="selTarget(this,15)" class="sel">15</button>
      <button onclick="selTarget(this,21)">21</button>
      <button onclick="selTarget(this,30)">30</button>
      <button onclick="selTarget(this,0)">ไม่จำกัด</button>
    </div>
  </div>

  <div class="timer-card" id="timerCard">
    <label>⏱️ นาฬิกาต่อควอร์เตอร์</label>
    <div class="timer-row">
      <label class="timer-toggle" onclick="toggleTimer()">
        <div class="toggle-switch" id="timerSwitch"></div>
        <span id="timerToggleLabel">ปิดอยู่</span>
      </label>
    </div>
    <div id="timerOptions" style="display:none">
      <div class="quarter-btns" id="qTimeBtns">
        <button onclick="selQTime(this,5*60)">5 นาที</button>
        <button onclick="selQTime(this,8*60)" class="sel">8 นาที</button>
        <button onclick="selQTime(this,10*60)">10 นาที</button>
        <button onclick="selQTime(this,12*60)">12 นาที</button>
      </div>
    </div>
  </div>

  <button class="start-btn" onclick="handleStart()">▶ เริ่มเกม!</button>
</div>

<!-- ══ 1v1 GAME ══ -->
<div class="page game-page" id="tab-game">
  <div class="game-top">
    <div class="game-info" id="gameInfo">เป้าหมาย: <b>15</b> แต้ม</div>
    <div class="top-actions">
      <button class="icon-btn" onclick="undoScore()" title="Undo">↩️</button>
      <button class="icon-btn" onclick="confirmReset()" title="Reset">🔄</button>
    </div>
  </div>

  <!-- Timer bar -->
  <div class="timer-bar hidden" id="timerBar">
    <span class="quarter-badge" id="qBadge">Q1</span>
    <span class="timer-display" id="timerDisp">08:00</span>
    <div class="timer-ctrl">
      <button class="btn-timer-play" id="timerPlayBtn" onclick="timerToggle()">▶</button>
      <button class="btn-timer-next" onclick="nextQuarter()">Q+1</button>
    </div>
  </div>

  <div class="scoreboard">
    <div class="player-side p1">
      <div class="p-name" id="gName1">ผู้เล่น 1</div>
      <div class="score-num" id="gScore1">0</div>
      <div class="add-btns">
        <button class="add-btn" onclick="addScore(1,1)">+1</button>
        <button class="add-btn" onclick="addScore(1,2)">+2</button>
        <button class="add-btn" onclick="addScore(1,3)">+3</button>
      </div>
    </div>
    <div class="v-divider"></div>
    <div class="player-side p2">
      <div class="p-name" id="gName2">ผู้เล่น 2</div>
      <div class="score-num" id="gScore2">0</div>
      <div class="add-btns">
        <button class="add-btn" onclick="addScore(2,1)">+1</button>
        <button class="add-btn" onclick="addScore(2,2)">+2</button>
        <button class="add-btn" onclick="addScore(2,3)">+3</button>
      </div>
    </div>
  </div>

  <div class="game-footer">
    <button class="btn-undo"  onclick="undoScore()">↩ Undo</button>
    <button class="btn-reset" onclick="confirmReset()">🔄 Reset</button>
    <button class="btn-end"   onclick="endGameManual()">🏁 จบเกม</button>
  </div>
</div>

<!-- ══ ROUND ROBIN ══ -->
<div class="page rr-page" id="tab-rr">
  <div class="rr-header">
    <h2>🏆 Round Robin</h2>
    <button class="icon-btn" onclick="if(confirm('ยกเลิก tournament?')){resetRR();showTab('setup')}">✕</button>
  </div>
  <div class="standings-card">
    <div class="standings-title">🥇 ตารางคะแนน</div>
    <div id="rrStandings"></div>
  </div>
  <div class="matches-section">
    <div class="matches-title">📅 ตารางแมตช์</div>
    <div id="rrMatches"></div>
  </div>
  <div class="rr-footer">
    <button class="rr-next-btn" id="rrNextBtn" onclick="playCurrentMatch()">
      ▶ เล่นแมตช์ถัดไป
    </button>
  </div>
</div>

<!-- ══ HISTORY ══ -->
<div class="page history-page" id="tab-history">
  <div id="historyList"></div>
</div>

<!-- WIN OVERLAY -->
<div class="win-overlay" id="winOverlay">
  <div class="confetti-row">🎊🏆🎊</div>
  <div class="win-label">🏅 ชนะแล้ว!</div>
  <div class="win-name" id="winName">-</div>
  <div class="win-score" id="winScoreTxt">-</div>
  <div class="win-actions">
    <button class="btn-new"  onclick="winNewGame()">🔄 เกมใหม่ (ผู้เล่นเดิม)</button>
    <button class="btn-back" onclick="winBack()">✏️ เปลี่ยนผู้เล่น</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
const COLORS = ['#ff5c5c','#4c9fe0','#3ecf7e','#a78bfa'];
let mode = '1v1';           // '1v1' | 'rr'
let playerNames = ['ผู้เล่น 1','ผู้เล่น 2'];
let target = 15;
let useTimer = false;
let qTimeSec = 8*60;

// 1v1 game state
let scores = [0,0];
let undoStack = [];
let gameActive = false;

// Timer state
let timerSec = 0;
let timerRunning = false;
let timerInterval = null;
let currentQuarter = 1;

// Round Robin
let rrPlayers = [];
let rrMatches = [];       // [{p1,p2,s1,s2,done}]
let rrCurrentIdx = -1;

// ══════════════════════════════════════════
// PWA
// ══════════════════════════════════════════
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
setMode('1v1');

function setMode(m){
  mode = m;
  document.getElementById('mode1v1').classList.toggle('active', m==='1v1');
  document.getElementById('modeRR').classList.toggle('active', m==='rr');
  renderPlayerInputs();
}

function renderPlayerInputs(){
  const count = mode==='1v1' ? 2 : 4;
  const grid = document.getElementById('playersGrid');
  grid.innerHTML = '';
  for(let i=0;i<count;i++){
    const label = ['🔴','🔵','🟢','🟣'][i];
    const def = playerNames[i] || `ผู้เล่น ${i+1}`;
    grid.innerHTML += `
      <div class="player-input-row">
        <div class="player-dot" style="background:${COLORS[i]}"></div>
        <input id="pname${i}" type="text" placeholder="${label} ผู้เล่น ${i+1}"
          value="${def}" maxlength="16"/>
      </div>`;
  }
}

// ══════════════════════════════════════════
// TABS
// ══════════════════════════════════════════
const TAB_IDS = ['setup','game','rr','history'];
function showTab(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-bar button').forEach(b=>b.classList.remove('active'));
  const page = document.getElementById('tab-'+id);
  if(page) page.classList.add('active');

  // tab bar highlight
  const map = {setup:0,game:1,rr:1,history:2};
  document.querySelectorAll('.tab-bar button')[map[id]]?.classList.add('active');

  if(id==='history') renderHistory();
  if(id==='rr') renderRR();
}

// ══════════════════════════════════════════
// TARGET & TIMER SETUP
// ══════════════════════════════════════════
function selTarget(btn,val){
  document.querySelectorAll('#targetBtns button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); target=val;
}
function selQTime(btn,sec){
  document.querySelectorAll('#qTimeBtns button').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel'); qTimeSec=sec;
}
function toggleTimer(){
  useTimer=!useTimer;
  document.getElementById('timerSwitch').classList.toggle('on',useTimer);
  document.getElementById('timerToggleLabel').textContent = useTimer ? 'เปิดอยู่' : 'ปิดอยู่';
  document.getElementById('timerOptions').style.display = useTimer ? 'block' : 'none';
}

// ══════════════════════════════════════════
// START
// ══════════════════════════════════════════
function handleStart(){
  const count = mode==='1v1' ? 2 : 4;
  playerNames = [];
  for(let i=0;i<count;i++){
    const v = document.getElementById('pname'+i)?.value.trim();
    playerNames.push(v || `ผู้เล่น ${i+1}`);
  }
  if(mode==='1v1') startOneVOne();
  else startRoundRobin();
}

// ══════════════════════════════════════════
// 1v1 GAME
// ══════════════════════════════════════════
function startOneVOne(idx1=0,idx2=1,resetScores=true){
  if(resetScores){ scores=[0,0]; undoStack=[]; }
  gameActive=true;

  document.getElementById('gName1').textContent = playerNames[idx1];
  document.getElementById('gName2').textContent = playerNames[idx2];
  document.getElementById('gScore1').textContent = scores[0];
  document.getElementById('gScore2').textContent = scores[1];

  const gi = document.getElementById('gameInfo');
  gi.innerHTML = target===0 ? 'โหมด: <b>ไม่จำกัด</b>' : `เป้าหมาย: <b>${target}</b> แต้ม`;

  // Timer setup
  stopTimer();
  currentQuarter=1;
  timerSec=qTimeSec;
  const bar = document.getElementById('timerBar');
  bar.classList.toggle('hidden', !useTimer);
  if(useTimer) updateTimerUI();

  showTab('game');
}

function addScore(player,pts){
  if(!gameActive){ toast('กด "เริ่มเกม" ก่อนนะ!'); return; }
  undoStack.push([...scores]);
  scores[player-1]+=pts;
  const el=document.getElementById('gScore'+player);
  el.textContent=scores[player-1];
  el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
  if(target>0 && scores[player-1]>=target) setTimeout(()=>showWin(player-1),200);
}

function undoScore(){
  if(!undoStack.length){ toast('ไม่มีอะไรให้ย้อน'); return; }
  scores=undoStack.pop();
  document.getElementById('gScore1').textContent=scores[0];
  document.getElementById('gScore2').textContent=scores[1];
  toast('↩ Undo แล้ว');
}

function confirmReset(){
  if(confirm('Reset สกอร์เกมนี้?')){
    scores=[0,0]; undoStack=[];
    document.getElementById('gScore1').textContent='0';
    document.getElementById('gScore2').textContent='0';
    stopTimer(); currentQuarter=1; timerSec=qTimeSec;
    if(useTimer) updateTimerUI();
    toast('Reset แล้ว!');
  }
}

function endGameManual(){
  const winner = scores[0]>scores[1]?0:scores[0]<scores[1]?1:null;
  if(winner===null){ toast('สกอร์เสมอกัน ยังสรุปไม่ได้'); return; }
  showWin(winner);
}

// ══════════════════════════════════════════
// TIMER
// ══════════════════════════════════════════
function timerToggle(){
  if(timerRunning) stopTimer(); else startTimer();
}
function startTimer(){
  if(timerSec<=0) return;
  timerRunning=true;
  document.getElementById('timerPlayBtn').textContent='⏸';
  timerInterval=setInterval(()=>{
    timerSec--;
    updateTimerUI();
    if(timerSec<=0){ stopTimer(); toast(`⏰ Q${currentQuarter} หมดเวลา!`); }
  },1000);
}
function stopTimer(){
  clearInterval(timerInterval); timerInterval=null;
  timerRunning=false;
  const b=document.getElementById('timerPlayBtn');
  if(b) b.textContent='▶';
}
function nextQuarter(){
  stopTimer(); currentQuarter++;
  timerSec=qTimeSec;
  updateTimerUI();
  toast(`เริ่ม Q${currentQuarter}`);
}
function updateTimerUI(){
  const m=Math.floor(timerSec/60), s=timerSec%60;
  const disp=document.getElementById('timerDisp');
  disp.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  disp.classList.toggle('warning', timerSec<=30 && timerSec>0);
  document.getElementById('qBadge').textContent=`Q${currentQuarter}`;
}

// ══════════════════════════════════════════
// WIN
// ══════════════════════════════════════════
let winnerP1idx=0,winnerP2idx=1; // track which players were in this match
function showWin(winnerIdx){
  gameActive=false; stopTimer();
  const n1=document.getElementById('gName1').textContent;
  const n2=document.getElementById('gName2').textContent;
  const winner=winnerIdx===0?n1:n2;
  const loser =winnerIdx===0?n2:n1;
  document.getElementById('winName').textContent='🏆 '+winner;
  document.getElementById('winScoreTxt').textContent=`${scores[0]} – ${scores[1]}  (${n1} vs ${n2})`;
  document.getElementById('winOverlay').classList.add('show');
  saveHistory(winner,loser,n1,n2,scores[0],scores[1]);

  // If RR mode, record result
  if(mode==='rr' && rrCurrentIdx>=0){
    const m=rrMatches[rrCurrentIdx];
    m.s1=scores[0]; m.s2=scores[1]; m.done=true;
    rrCurrentIdx=-1;
  }
}

function winNewGame(){
  document.getElementById('winOverlay').classList.remove('show');
  if(mode==='rr'){ renderRR(); showTab('rr'); }
  else { scores=[0,0]; undoStack=[]; startOneVOne(); }
}
function winBack(){
  document.getElementById('winOverlay').classList.remove('show');
  if(mode==='rr'){ renderRR(); showTab('rr'); }
  else showTab('setup');
}

// ══════════════════════════════════════════
// ROUND ROBIN
// ══════════════════════════════════════════
function genRRMatches(n){
  const ms=[];
  for(let i=0;i<n;i++) for(let j=i+1;j<n;j++)
    ms.push({p1:i,p2:j,s1:null,s2:null,done:false});
  return ms;
}

function startRoundRobin(){
  rrPlayers=playerNames.slice(0,4);
  rrMatches=genRRMatches(4);
  rrCurrentIdx=-1;
  showTab('rr');
}

function renderRR(){
  renderStandings();
  renderMatches();
  const allDone=rrMatches.every(m=>m.done);
  const btn=document.getElementById('rrNextBtn');
  if(allDone){
    btn.textContent='🏆 Tournament จบแล้ว!';
    btn.disabled=true;
  } else {
    const next=rrMatches.findIndex(m=>!m.done);
    btn.disabled=false;
    if(next>=0){
      const m=rrMatches[next];
      btn.textContent=`▶ เล่น: ${rrPlayers[m.p1]} vs ${rrPlayers[m.p2]}`;
    }
  }
}

function renderStandings(){
  const stats=rrPlayers.map((name,i)=>({name,i,w:0,l:0,pts:0,scored:0,conceded:0}));
  rrMatches.filter(m=>m.done).forEach(m=>{
    const winner=m.s1>m.s2?m.p1:m.p2;
    const loser =m.s1>m.s2?m.p2:m.p1;
    stats[winner].w++; stats[winner].pts+=2;
    stats[loser].l++;  stats[loser].pts+=1;
    stats[m.p1].scored+=m.s1; stats[m.p1].conceded+=m.s2;
    stats[m.p2].scored+=m.s2; stats[m.p2].conceded+=m.s1;
  });
  stats.sort((a,b)=>b.pts-a.pts||(b.scored-b.conceded)-(a.scored-a.conceded));

  const rankClass=['rank-1','rank-2','rank-3','rank-4'];
  document.getElementById('rrStandings').innerHTML=stats.map((s,rank)=>`
    <div class="standings-row">
      <div class="rank-badge ${rankClass[rank]}">${rank+1}</div>
      <div class="s-name" style="color:${COLORS[s.i]}">${s.name}</div>
      <div class="s-stats">
        <span><b>${s.w}</b>W</span>
        <span><b>${s.l}</b>L</span>
        <span><b>${s.pts}</b>pt</span>
      </div>
    </div>`).join('');
}

function renderMatches(){
  document.getElementById('rrMatches').innerHTML=rrMatches.map((m,i)=>{
    const isCurrent=!m.done && rrMatches.slice(0,i).every(x=>x.done);
    const scoreStr = m.done ? `${m.s1} – ${m.s2}` : 'vs';
    const statusTxt = m.done?'✅ จบแล้ว':isCurrent?'▶ เล่นต่อไป':'⏳ รอคิว';
    const cls = m.done?'done':isCurrent?'current':'pending';
    return `<div class="match-card ${cls}">
      <div class="m-player left" style="color:${COLORS[m.p1]}">${rrPlayers[m.p1]}</div>
      <div>
        <div class="m-score-box">${scoreStr}</div>
        <div class="m-status">${statusTxt}</div>
      </div>
      <div class="m-player right" style="color:${COLORS[m.p2]}">${rrPlayers[m.p2]}</div>
    </div>`;
  }).join('');
}

function playCurrentMatch(){
  const idx=rrMatches.findIndex(m=>!m.done);
  if(idx<0) return;
  rrCurrentIdx=idx;
  const m=rrMatches[idx];
  scores=[0,0]; undoStack=[];
  const orig=playerNames.slice();
  playerNames[0]=rrPlayers[m.p1];
  playerNames[1]=rrPlayers[m.p2];
  startOneVOne(0,1,true);
  playerNames=orig;
  // update display names correctly
  document.getElementById('gName1').textContent=rrPlayers[m.p1];
  document.getElementById('gName2').textContent=rrPlayers[m.p2];
}

function resetRR(){
  rrMatches=[]; rrPlayers=[]; rrCurrentIdx=-1;
}

// ══════════════════════════════════════════
// HISTORY
// ══════════════════════════════════════════
function saveHistory(winner,loser,p1,p2,s1,s2){
  const arr=JSON.parse(localStorage.getItem('bbHistory')||'[]');
  arr.unshift({winner,loser,p1,p2,s1,s2,
    date:new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})});
  if(arr.length>50) arr.pop();
  localStorage.setItem('bbHistory',JSON.stringify(arr));
}

function renderHistory(){
  const arr=JSON.parse(localStorage.getItem('bbHistory')||'[]');
  const el=document.getElementById('historyList');
  if(!arr.length){
    el.innerHTML=`<div class="history-empty">
      <div class="big">📋</div><p>ยังไม่มีประวัติ</p>
      <p style="font-size:.8rem">เล่นแล้วจบเกมจะบันทึกอัตโนมัติ</p></div>`;
    return;
  }
  const wins={};
  arr.forEach(g=>{ wins[g.winner]=(wins[g.winner]||0)+1; });
  const leaders=Object.entries(wins).sort((a,b)=>b[1]-a[1]);
  const medals=['🥇','🥈','🥉'];

  let html=`<div class="leader-card">
    <div class="label">🏅 ลีดเดอร์บอร์ด</div>
    ${leaders.map(([n,w],i)=>`<div class="leader-row">
      <span>${medals[i]||'  '} ${n}</span>
      <span>${w} ชนะ</span></div>`).join('')}
  </div>
  <div style="font-size:.7rem;font-weight:800;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:6px">📅 ประวัติแมตช์</div>
  ${arr.map(g=>`<div class="h-card">
    <span class="h-icon">🏆</span>
    <div class="h-info">
      <div class="h-players">${g.winner} ชนะ ${g.loser}</div>
      <div class="h-result">${g.p1} ${g.s1} – ${g.s2} ${g.p2}</div>
      <div class="h-date">${g.date}</div>
    </div></div>`).join('')}
  <button class="clear-btn" onclick="clearHist()">🗑 ล้างประวัติทั้งหมด</button>`;
  el.innerHTML=html;
}

function clearHist(){
  if(confirm('ล้างประวัติทั้งหมด?')){
    localStorage.removeItem('bbHistory'); renderHistory(); toast('ล้างประวัติแล้ว');
  }
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800);
}
</script>
</body>
</html>
